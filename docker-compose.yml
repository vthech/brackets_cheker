version: '3.9'

services:
  php:
    build:
      context: ./docker/php
    container_name: symfony_php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:latest
    container_name: symfony_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php